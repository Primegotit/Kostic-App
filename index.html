<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="tailwind.js"></script>
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="style.css">
    

    </head>
<body  >
   <header class="w-full h-16 bg-[#f77f00]">
        <div class="flex flex-row gap-3 items-center justify-center p-3 ">
            <img src="images/logo15.png" alt="" class="h-9 ">
            <h3 class="text-white text-2xl font-bold">KOSTIC</h3>
        </div>
   </header>


   <main class="flex flex-col justify-center items-center h-[calc(100vh-4rem)]">

        <div class="w-11/12 md:w-7/12 lg:w-5/12  h-6/7 bg-[#f77f00] p-6 rounded-lg flex flex-col items-center gap-2 shadow-lg">
            <h3 class="text-white  font-bold  ">Enter your login details</h3>
            <form action="" class="w-full flex flex-col gap-6 h-full  p-2 justify-start ">
                <div class="flex flex-col justfiy-center items-center ">
                    <img src="images/logo15.png" alt="" class="h-14 ">
                </div>
                <div class="flex flex-col gap-6 self-center w-11/12">
                    <div class="flex flex-col gap-1">
                        <label for="" class="text-white">Login</label>
                        <input type="text" placeholder="Enter your username" class="p-1 rounded-lg">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="" class="text-white">Password</label>
                        <input type="password" placeholder="Enter your password" class="p-1 rounded-lg">
                    </div>
                
                </div>
                
                <button type="submit" class="w-11/12 mt-2 flex flex-col self-center items-center justify-center shadow-lg hover:scale-105 p-1 rounded-lg h-10 text-md font-bold bg-black text-white transition duration-300 ">Login</button>
            </form>
        </div>
   </main>
</body>
</html>
